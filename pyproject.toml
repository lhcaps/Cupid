[project]
name = "visioncombatlab"
version = "0.1.0"
description = "Screen/video analysis + HSM-driven combat automation for GPO Cupid Dungeon Wave 1 MVP"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.10.0",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "mss>=9.0.0",
    "pynput>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "COM812", "ISC001"]

[tool.pytest]
testpaths = ["tests"]
