# Wave 1 MVP Config — Shattered Ramparts at 2560x1440
# Runtime backends
capture:
  backend: "mss"
  monitor_index: 1
  fps_target: 20
  region: null
  output_color: "BGR"

input:
  backend: "pynput"
  tap_delay_ms: 10
  focus_window_title: "Roblox"
  require_focus: true
  fail_on_input_error: true

debug:
  input: false
  vision: false
  save_every_n_frames: 20
  output_dir: "reports/vision_debug"

yolo:
  enabled: false
  model_path: "models/cupid_wave1_yolo.pt"
  confidence: 0.3
  device: "auto"
  classes:
    enemy: 0
    exit: 1
    player: 2
    progress_panel: 3
    objective_counter: 4

screen:
  width: 2560
  height: 1440
  fps_target: 20

keybinds:
  slot_pika_v2: "2"
  armament_haki: "j"
  observation_haki: "g"
  jump: "space"
  forward: "w"
  backward: "s"
  radiant_kick: "r"
  dash: "q"
  blitz_strike: "e"

# Progress UI crop regions (live dxcam 2560x1440, text counter on left panel)
# Counter "x / 4": LEFT at x=110-240, y=545-610
# Wave panel: LEFT at x=0-500, y=450-560
# Combined progress UI area: x=0-600, y=450-650
progress_ui:
  crop: [0, 450, 600, 650]
  counter_crop: [110, 545, 240, 610]
  wave_panel_crop: [0, 450, 500, 560]
  stage_name: "Shattered Ramparts"
  dungeon_name: "Cupid's Ruin"
  objective_total: 4
  min_confidence: 0.75

# Compass crop (from video analysis)
# TOP CENTER at x=1260-1295, y=15-55 (single letter indicator)
# But full compass bar spans the top
compass:
  crop: [1200, 10, 1400, 60]
  target_exit_heading: "S"
  heading_tolerance_deg: 15
  rotate_timeout_sec: 3.0

wave1:
  setup_delay_ms: 500
  geppo_count: 5
  geppo_interval_ms_min: 100
  geppo_interval_ms_max: 180
  aggro_wait_ms: 1000
  radiant_kick_charge_ms: 2000
  damage_register_wait_ms: 2200
  verify_window_sec: 1.5
  max_cleanup_cycles: 2
  next_stage_name: "The Forsaken Garden"
  # Stage start guard: only 0/4 passes by default.
  # Set initial_counter_max to None or use allow_resume_mid_wave to allow mid-wave resume.
  initial_counter_max: 0
  allow_resume_mid_wave: false
  # Persistent clear: fires when many 4/4 reads with intermittent confidence
  stable_window_size: 3
  stable_required_count: 3
  persistent_window_size: 12
  persistent_required_total: 8
  persistent_required_strong: 2

observation_haki:
  scan_duration_ms: 900
  min_target_confidence: 0.65
  max_scans_per_stage: 2

safety:
  emergency_stop_key: "f1"
  max_state_duration_sec: 15.0
  release_all_keys_on_stop: true
  save_failure_screenshot: true
