# Default app config — baseline values for 2560x1440 screens
screen:
  width: 2560
  height: 1440
  fps_target: 20

keybinds:
  slot_pika_v2: "2"
  armament_haki: "j"
  observation_haki: "g"
  jump: "space"
  forward: "w"
  backward: "s"
  radiant_kick: "r"
  dash: "q"
  blitz_strike: "e"

progress_ui:
  crop: [1300, 0, 1850, 180]
  counter_crop: [1380, 110, 1620, 150]
  wave_panel_crop: [1500, 0, 1760, 100]
  stage_name: "Shattered Ramparts"
  dungeon_name: "Cupid's Ruin"
  objective_total: 4
  min_confidence: 0.75

compass:
  crop: [1200, 10, 1400, 60]
  target_exit_heading: "S"
  heading_tolerance_deg: 15
  rotate_timeout_sec: 3.0

wave1:
  setup_delay_ms: 500
  geppo_count: 5
  geppo_interval_ms_min: 100
  geppo_interval_ms_max: 180
  aggro_wait_ms: 1000
  radiant_kick_charge_ms: 2000
  damage_register_wait_ms: 2200
  verify_window_sec: 1.5
  max_cleanup_cycles: 2
  next_stage_name: "The Forsaken Garden"

observation_haki:
  scan_duration_ms: 900
  min_target_confidence: 0.65
  max_scans_per_stage: 2

safety:
  emergency_stop_key: "f1"
  max_state_duration_sec: 15.0
  release_all_keys_on_stop: true
  save_failure_screenshot: true

# Capture backend: mss (default) or dxcam (Windows/DirectX)
# dxcam requires: pip install dxcam
capture:
  backend: "mss"
  monitor_index: 1
  fps_target: 20
  region: null
  output_color: "BGR"

# Input backend: pynput (default), pydirectinput (DirectX/game), pyautogui (fallback)
# pydirectinput/pyautogui require: pip install pyautogui
input:
  backend: "pynput"
  tap_delay_ms: 10
  focus_window_title: "Roblox"
  require_focus: true
  fail_on_input_error: true

# Debug settings
debug:
  input: false
  vision: false
  save_every_n_frames: 20
  output_dir: "reports/vision_debug"

# YOLO detector (optional, disabled by default)
# Enable with: pip install ".[yolo]"
yolo:
  enabled: false
  model_path: "models/cupid_wave1_yolo.pt"
  confidence: 0.3
  device: "auto"
  classes:
    enemy: 0
    exit: 1
    player: 2
    progress_panel: 3
    objective_counter: 4
