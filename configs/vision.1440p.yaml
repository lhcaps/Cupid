# Vision config for 1440p (2560x1440) screens
screen:
  width: 2560
  height: 1440
  fps_target: 20

progress_ui:
  crop: [1300, 0, 1850, 180]
  counter_crop: [1340, 100, 1620, 135]
  wave_panel_crop: [1300, 0, 1850, 180]
  min_confidence: 0.75

compass:
  crop: [0, 0, 2560, 90]
  heading_tolerance_deg: 12
