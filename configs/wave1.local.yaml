screen: {width: 2560, height: 1440, fps_target: 20}
keybinds: {slot_pika_v2: '2', armament_haki: j, observation_haki: g, jump: space,
  forward: w, backward: s, radiant_kick: r, dash: q, blitz_strike: e}
# Crops from live dxcam calibration (2560x1440):
# Progress UI is the LEFT wave panel, not the bottom-left buff/money stack.
#   - Counter "X / 4" at y=545-610, x=110-240
#   - Wave/stage name at y=450-560, x=0-500
# Compass active heading is at TOP-CENTER:
#   - Text cluster around y=10-60, x=1200-1400
# COMPASS TARGET: S (South = 180 degrees)
# CROPS ARE SCALED FOR THIS VIDEO'S RESOLUTION (2560x1440)
# If game resolution differs, re-calibrate
progress_ui:
  crop: [0, 450, 600, 650]
  counter_crop: [110, 545, 240, 610]
  wave_panel_crop: [0, 450, 500, 560]
  stage_name: Shattered Ramparts
  dungeon_name: Cupid's Ruin
  objective_total: 4
  min_confidence: 0.75
compass:
  crop: [1200, 10, 1400, 60]
  target_exit_heading: S
  heading_tolerance_deg: 15
  rotate_timeout_sec: 3.0
wave1: {setup_delay_ms: 500, geppo_count: 5, geppo_interval_ms_min: 100, geppo_interval_ms_max: 180,
  aggro_wait_ms: 1000, radiant_kick_charge_ms: 2000, damage_register_wait_ms: 2200,
  max_cleanup_cycles: 2, next_stage_name: The Forsaken Garden}
observation_haki: {scan_duration_ms: 900, min_target_confidence: 0.65, max_scans_per_stage: 2}
safety: {emergency_stop_key: f1, max_state_duration_sec: 15.0, release_all_keys_on_stop: true,
  save_failure_screenshot: true}
